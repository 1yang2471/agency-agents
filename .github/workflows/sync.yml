# 每周一 02:00 UTC 自动同步上游角色，重建 roles-index.json 并提交
name: sync-upstream

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 运行同步脚本
        shell: pwsh
        run: ./sync.ps1

      - name: 提交索引变更
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roles-index.json
          if (git diff --cached --quiet) {
            Write-Host "索引无变更，跳过提交"
          } else {
            git commit -m "chore: 同步上游角色索引 [skip ci]" | Out-Null
            git push
            Write-Host "已提交并推送索引更新"
          }
